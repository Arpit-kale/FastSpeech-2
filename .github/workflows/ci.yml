name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - name: Install dependencies (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python scripts/download_assets.py --nltk
      - name: Lint (syntax)
        run: python -m compileall -q fastspeech2 app English Telugu scripts
      - name: Unit and end-to-end smoke tests
        run: pytest -q
